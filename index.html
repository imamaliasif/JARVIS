<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS AI Assistant</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding-top: 40px;
        }
        h1 { color: #58a6ff; }
        #status { font-size: 1.1rem; margin: 15px; color: #8b949e; }
        
        .controls {
            margin: 20px auto;
            width: 80%;
            max-width: 500px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            font-size: 1rem;
            border-radius: 6px;
            border: 1px solid #30363d;
            background-color: #161b22;
            color: #c9d1d9;
            outline: none;
        }
        input[type="text"]:focus { border-color: #58a6ff; }
        
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background-color: #2ea043; }
        #mic-btn { background-color: #1f6feb; }
        #mic-btn:hover { background-color: #388bfd; }

        #output { 
            background: #161b22; 
            border: 1px solid #30363d; 
            display: inline-block; 
            padding: 20px; 
            border-radius: 8px; 
            width: 80%; 
            max-width: 500px;
            min-height: 120px;
            text-align: left;
            margin-top: 15px;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <h1>JARVIS Assistant</h1>
    <div id="status">Aap bol sakte hain ya neeche type kar sakte hain...</div>
    
    <!-- Voice & Text Controls -->
    <div class="controls">
        <button id="mic-btn" onclick="startListening()">🎤 Speak</button>
        <input type="text" id="textInput" placeholder="Type your command here..." onkeydown="handleKeyPress(event)">
        <button onclick="submitText()">Send</button>
    </div>
    
    <br>
    <div id="output"><strong>Log:</strong> Ready...</div>

    <script>
        // Yahan apni Gemini API Key likhein (Google AI Studio se free milti hai)
        const GEMINI_API_KEY = "YAHAN_APNI_GEMINI_API_KEY_LIKHEIN";

        const statusDiv = document.getElementById("status");
        const outputDiv = document.getElementById("output");

        // Text to Speech Function (Jarvis Voice)
        function speak(text) {
            const cleanText = text.replace(/[*#_`]/g, ''); // Aawaz ke liye formatting symbols saaf karna
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 1.0;
            utterance.pitch = 0.9; 
            window.speechSynthesis.speak(utterance);
        }

        // Speech Recognition Setup
        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Your browser does not support Speech Recognition. Try Microsoft Edge or Chrome!");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            statusDiv.innerHTML = "Listening... Apni poori baat kahein!";
            outputDiv.innerHTML = "<strong>Log:</strong> Listening...";

            recognition.start();

            recognition.onresult = function(event) {
                const command = event.results[0][0].transcript;
                outputDiv.innerHTML += `<br><span style="color: #3fb950;">You said: "${command}"</span>`;
                statusDiv.innerHTML = "Processing command...";
                handleCommand(command.toLowerCase(), command);
            };

            recognition.onerror = function(event) {
                statusDiv.innerHTML = "Error occurred: " + event.error;
                speak("I encountered an error while listening.");
            };

            recognition.onspeechend = function() {
                statusDiv.innerHTML = "Processing...";
                recognition.stop();
            };
        }

        // Handle Text Input Submission
        function submitText() {
            const inputField = document.getElementById("textInput");
            const command = inputField.value.trim();
            if (command) {
                outputDiv.innerHTML += `<br><span style="color: #3fb950;">You typed: "${command}"</span>`;
                handleCommand(command.toLowerCase(), command);
                inputField.value = "";
            }
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                submitText();
            }
        }

        // Smart Command Routing & AI Logic
        async function handleCommand(cmd, originalCmd) {
            // 1. Explicit Website / Search Commands
            if (cmd.includes("youtube") && (cmd.includes("play") || cmd.includes("search") || cmd.includes("open"))) {
                let query = originalCmd.replace(/youtube|play|search|open|on/gi, "").trim();
                if (query) {
                    let msg = `Playing ${query} on YouTube, Sir.`;
                    outputDiv.innerHTML += `<br><span style="color: #58a6ff;">JARVIS: ${msg}</span>`;
                    speak(msg);
                    window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`, '_blank');
                } else {
                    let msg = "Opening YouTube, Sir.";
                    outputDiv.innerHTML += `<br><span style="color: #58a6ff;">JARVIS: ${msg}</span>`;
                    speak(msg);
                    window.open("https://www.youtube.com", '_blank');
                }
            } 
            else if (cmd.includes("search in google") || cmd.includes("search on google") || cmd.includes("open google")) {
                let query = originalCmd.replace(/search in google|search on google|open google/gi, "").trim();
                if (query) {
                    let msg = `Searching for ${query} on Google, Sir.`;
                    outputDiv.innerHTML += `<br><span style="color: #58a6ff;">JARVIS: ${msg}</span>`;
                    speak(msg);
                    window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
                } else {
                    let msg = "Opening Google, Sir.";
                    outputDiv.innerHTML += `<br><span style="color: #58a6ff;">JARVIS: ${msg}</span>`;
                    speak(msg);
                    window.open("https://www.google.com", '_blank');
                }
            }
            // 2. Local shortcuts (Time, Name, etc.)
            else if (cmd.includes("your name")) {
                let msg = "I am JARVIS, your personal AI assistant.";
                outputDiv.innerHTML += `<br><span style="color: #58a6ff;">JARVIS: ${msg}</span>`;
                speak(msg);
            }
            else if (cmd.includes("time")) {
                const now = new Date();
                let msg = `The current time is ${now.toLocaleTimeString()}, Sir.`;
                outputDiv.innerHTML += `<br><span style="color: #58a6ff;">JARVIS: ${msg}</span>`;
                speak(msg);
            }
            // 3. General Questions -> Automatically fetched from Gemini AI API
            else {
                statusDiv.innerHTML = "Thinking...";
                outputDiv.innerHTML += `<br><span style="color: #8b949e;">JARVIS: Thinking...</span>`;
                
                try {
                    const aiResponse = await askGemini(originalCmd);
                    outputDiv.innerHTML += `<br><span style="color: #58a6ff;">JARVIS: ${aiResponse}</span>`;
                    speak(aiResponse);
                } catch (error) {
                    let errMessage = "Sorry Sir, I am having trouble connecting to my neural network.";
                    outputDiv.innerHTML += `<br><span style="color: #ff7b72;">JARVIS: ${errMessage}</span>`;
                    speak(errMessage);
                }
            }
            
            statusDiv.innerHTML = "Aap bol sakte hain ya neeche type kar sakte hain...";
        }

        // Gemini API Request Function
        async function askGemini(promptText) {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: "You are JARVIS, a helpful AI assistant. Answer concisely and professionally: " + promptText }]
                    }]
                })
            });

            const data = await response.json();
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                return data.candidates[0].content.parts[0].text;
            } else {
                return "I couldn't generate a response for that, Sir.";
            }
        }
    </script>
</body>
</html>
