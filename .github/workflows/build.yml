name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK with Cordova/Bubblewrap (or Webview wrapper)
      run: |
        npm install -g nativefier
        nativefier --name "JARVIS" --platform android --arch arm64-v8a "https://YOUR_GITHUB_USERNAME.github.io/YOUR_REPO_NAME/" --out ./release-build-dir
